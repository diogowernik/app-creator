name: Starter
on: [push, pull_request]
jobs:
  generated-app:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - uses: astral-sh/setup-uv@v6
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: python -m unittest discover -s tests -v
      - run: bash create-app.sh ci-app --destination .validation --mode migration --prepare
      - run: .venv/bin/ruff check api
        working-directory: .validation/ci-app
      - run: .venv/bin/python api/manage.py test
        working-directory: .validation/ci-app
        env:
          DJANGO_ENV: development
      - run: npm run lint && npm test && npm run typecheck && npm run build
        working-directory: .validation/ci-app/web
        env:
          NEXT_DIST_DIR: .next-codex
      - run: .venv/bin/python scripts/test_auth.py
        working-directory: .validation/ci-app
